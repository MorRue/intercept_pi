---
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Debian bookworm, wxWidgets 3.2)
    runs-on: ubuntu-latest
    # bookworm ships wxWidgets 3.2 in apt and has an older glibc (2.36) than
    # the ubuntu-latest runner, so the artifact loads on more crew machines.
    # Ubuntu 22.04 has no wx 3.2 package at all — that was the old failure.
    container: debian:bookworm
    steps:
      - name: Install toolchain and wxWidgets 3.2
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates git lsb-release pkg-config \
            build-essential cmake gettext \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev libwxgtk-media3.2-dev \
            libgtk-3-dev libglu1-mesa-dev \
            libbz2-dev libcurl4-openssl-dev libexpat1-dev libcairo2-dev \
            libarchive-dev liblzma-dev liblz4-dev libexif-dev libelf-dev \
            xvfb

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Metadata.cmake derives the package version from git describe,
          # so the full history and tags must be present.
          fetch-depth: 0

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tarball
        run: cmake --build build --target tarball -j2

      - name: Build and run tests
        run: |
          cmake --build build -j2
          # test_overlay draws with wxBitmap/wxMemoryDC, which need a
          # display connection on Linux even for off-screen rendering.
          xvfb-run --auto-servernum \
            ctest --test-dir build --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarball
          path: build/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (MSVC 2022, Win32, wxWidgets 3.2)
    runs-on: windows-2022
    env:
      WX_VER: 3.2.6
      # PluginLibs.cmake checks for %WXWIN%; win_deps normally sets it.
      WXWIN: ${{ github.workspace }}\cache\wxWidgets
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: MSVC dev environment (x86 / Win32)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Cache prebuilt wxWidgets
        id: wxcache
        uses: actions/cache@v4
        with:
          path: cache
          key: wxwidgets-${{ env.WX_VER }}-vc14x-win32

      - name: Download prebuilt wxWidgets ${{ env.WX_VER }}
        if: steps.wxcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://github.com/wxWidgets/wxWidgets/releases/download/v$env:WX_VER"
          New-Item -ItemType Directory -Force -Path $env:WXWIN | Out-Null
          foreach ($f in @(
              "wxWidgets-$env:WX_VER-headers.7z",
              "wxMSW-${env:WX_VER}_vc14x_Dev.7z",
              "wxMSW-${env:WX_VER}_vc14x_ReleaseDLL.7z")) {
            Invoke-WebRequest -Uri "$base/$f" -OutFile $f
            7z x -aoa $f "-o$env:WXWIN"
          }
          Rename-Item "$env:WXWIN\lib\vc14x_dll" vc_dll

      - name: Install gettext
        shell: pwsh
        # PluginLibs.cmake does find_package(Gettext REQUIRED). The old step
        # pulled it from Poedit, whose installer URL now 404s. Use the
        # prebuilt Windows binaries from mlocati/gettext-iconv-windows
        # (stable GitHub release assets) and put them on PATH for Configure.
        run: |
          $rel = Invoke-RestMethod 'https://api.github.com/repos/mlocati/gettext-iconv-windows/releases/latest'
          $asset = $rel.assets | Where-Object { $_.name -like '*-static-64.zip' } | Select-Object -First 1
          if (-not $asset) { throw "no static-64 asset in $($rel.tag_name)" }
          $dest = Join-Path $env:RUNNER_TEMP 'gettext'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile gettext.zip
          Expand-Archive -Path gettext.zip -DestinationPath $dest -Force
          $bin = Get-ChildItem $dest -Recurse -Filter msgmerge.exe |
                 Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $bin) { throw 'msgmerge.exe not found in the gettext archive' }
          Write-Host "gettext bin: $bin ($($rel.tag_name))"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\msgmerge.exe" --version | Select-Object -First 1

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A Win32 -T v143
          -DCMAKE_BUILD_TYPE=Release
          -DwxWidgets_ROOT_DIR="$env:WXWIN"
          -DwxWidgets_LIB_DIR="$env:WXWIN\lib\vc_dll"

      - name: Build tarball
        run: cmake --build build --target tarball --config Release

      - name: Build and run tests
        shell: pwsh
        run: |
          cmake --build build --config Release
          # test_grib_reader dynamically links wxbase; its DLL lives next
          # to the import libs PluginLibs.cmake was pointed at above.
          $env:PATH = "$env:WXWIN\lib\vc_dll;$env:PATH"
          ctest --test-dir build --output-on-failure -C Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-win32-tarball
          path: build/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=()
          [[ "$tag" == *-* ]] && prerelease=(--prerelease)
          files=(artifacts/*/*.tar.gz)
          notes="Automated build from \`$tag\`.

          Changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/Changelog.md

          **Not verified for operational use** — see the README and
          \`docs/LEEWAY_NEEDS_VERIFICATION.md\`."
          gh release create "$tag" "${prerelease[@]}" --title "$tag" \
            --notes "$notes" "${files[@]}" \
          || gh release upload "$tag" "${files[@]}" --clobber
