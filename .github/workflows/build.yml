---
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Debian bookworm, wxWidgets 3.2)
    runs-on: ubuntu-latest
    # bookworm ships wxWidgets 3.2 in apt and has an older glibc (2.36) than
    # the ubuntu-latest runner, so the artifact loads on more crew machines.
    # Ubuntu 22.04 has no wx 3.2 package at all — that was the old failure.
    container: debian:bookworm
    steps:
      - name: Install toolchain and wxWidgets 3.2
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates git lsb-release pkg-config \
            build-essential cmake gettext \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev libwxgtk-media3.2-dev \
            libgtk-3-dev libglu1-mesa-dev \
            libbz2-dev libcurl4-openssl-dev libexpat1-dev libcairo2-dev \
            libarchive-dev liblzma-dev liblz4-dev libexif-dev libelf-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Metadata.cmake derives the package version from git describe,
          # so the full history and tags must be present.
          fetch-depth: 0

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tarball
        run: cmake --build build --target tarball -j2

      - name: Build and run tests
        run: |
          cmake --build build -j2
          ctest --test-dir build --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarball
          path: build/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (MSVC 2022, Win32, wxWidgets 3.2)
    runs-on: windows-2022
    env:
      WX_VER: 3.2.6
      # PluginLibs.cmake checks for %WXWIN%; win_deps normally sets it.
      WXWIN: ${{ github.workspace }}\cache\wxWidgets
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: MSVC dev environment (x86 / Win32)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Cache prebuilt wxWidgets
        id: wxcache
        uses: actions/cache@v4
        with:
          path: cache
          key: wxwidgets-${{ env.WX_VER }}-vc14x-win32

      - name: Download prebuilt wxWidgets ${{ env.WX_VER }}
        if: steps.wxcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://github.com/wxWidgets/wxWidgets/releases/download/v$env:WX_VER"
          New-Item -ItemType Directory -Force -Path $env:WXWIN | Out-Null
          foreach ($f in @(
              "wxWidgets-$env:WX_VER-headers.7z",
              "wxMSW-${env:WX_VER}_vc14x_Dev.7z",
              "wxMSW-${env:WX_VER}_vc14x_ReleaseDLL.7z")) {
            Invoke-WebRequest -Uri "$base/$f" -OutFile $f
            7z x -aoa $f "-o$env:WXWIN"
          }
          Rename-Item "$env:WXWIN\lib\vc14x_dll" vc_dll

      - name: Install gettext
        shell: pwsh
        # PluginLibs.cmake does find_package(Gettext REQUIRED). Prebuilt
        # Windows binaries from mlocati/gettext-iconv-windows, pinned to one
        # release and checked against its SHA-256: no GitHub API call (the
        # runner's anonymous API quota ran out and failed builds), and a
        # changed or replaced file fails the build instead of being run.
        # To update: pick a newer release asset, download it, and put its
        # URL and `shasum -a 256` here.
        env:
          GETTEXT_URL: https://github.com/mlocati/gettext-iconv-windows/releases/download/v1.0-v1.19/gettext1.0-iconv1.19-static-64.zip
          GETTEXT_SHA256: 2b999bc37b56fa052ff98578e9cb188152009f634e3a66aa8ff263a016e9c466
        run: |
          Invoke-WebRequest -Uri $env:GETTEXT_URL -OutFile gettext.zip
          $hash = (Get-FileHash gettext.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:GETTEXT_SHA256) {
            throw "gettext.zip SHA-256 is $hash, expected $env:GETTEXT_SHA256"
          }
          $dest = Join-Path $env:RUNNER_TEMP 'gettext'
          Expand-Archive -Path gettext.zip -DestinationPath $dest -Force
          $bin = Get-ChildItem $dest -Recurse -Filter msgmerge.exe |
                 Select-Object -First 1 -ExpandProperty DirectoryName
          if (-not $bin) { throw 'msgmerge.exe not found in the gettext archive' }
          Write-Host "gettext bin: $bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\msgmerge.exe" --version | Select-Object -First 1

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A Win32 -T v143
          -DCMAKE_BUILD_TYPE=Release
          -DwxWidgets_ROOT_DIR="$env:WXWIN"
          -DwxWidgets_LIB_DIR="$env:WXWIN\lib\vc_dll"

      - name: Build tarball
        run: cmake --build build --target tarball --config Release

      - name: Build and run tests
        shell: pwsh
        run: |
          cmake --build build --config Release
          # test_grib_reader dynamically links wxbase; its DLL lives next
          # to the import libs PluginLibs.cmake was pointed at above.
          $env:PATH = "$env:WXWIN\lib\vc_dll;$env:PATH"
          ctest --test-dir build --output-on-failure -C Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-win32-tarball
          path: build/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (universal, wxWidgets 3.2)
    # macOS runners bill 10x Linux minutes, so this one runs only for a
    # release tag, or by hand: Actions -> build -> "Run workflow".
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    env:
      # The universal wxWidgets 3.2 build OpenCPN's macOS app uses -- a
      # plugin must link against that exact build. Pinned by checksum like
      # gettext above; to update, download the file and put its shasum here.
      MACOS_DEPS_URL: https://dl.cloudsmith.io/public/nohal/opencpn-plugins/raw/files/macos_deps_universal.tar.xz
      MACOS_DEPS_SHA256: 36eca5efed89539b085649e4c4f691490c351a6fe463422153f775076db9dd54
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: brew install cmake gettext libexif openssl@3

      - name: Install OpenCPN's prebuilt wxWidgets
        run: |
          curl -fsSL -o deps.tar.xz "$MACOS_DEPS_URL"
          echo "$MACOS_DEPS_SHA256  deps.tar.xz" | shasum -a 256 -c -
          sudo mkdir -p /usr/local
          sudo tar -C /usr/local -xJf deps.tar.xz

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          "-DOCPN_TARGET_TUPLE=darwin-wx32;11;universal"

      - name: Build tarball
        run: cmake --build build --target tarball -j3

      - name: Build and run tests
        run: |
          cmake --build build -j3
          ctest --test-dir build --output-on-failure

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-tarball
          path: build/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prerelease=()
          [[ "$tag" == *-* ]] && prerelease=(--prerelease)
          files=(artifacts/*/*.tar.gz)
          notes="Automated build from \`$tag\`.

          Changelog: https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/Changelog.md

          **Not verified for operational use** — see the README and
          \`docs/LEEWAY_NEEDS_VERIFICATION.md\`."
          gh release create "$tag" "${prerelease[@]}" --title "$tag" \
            --notes "$notes" "${files[@]}" \
          || gh release upload "$tag" "${files[@]}" --clobber
