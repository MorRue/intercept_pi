---
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Debian bookworm, wxWidgets 3.2)
    runs-on: ubuntu-latest
    # bookworm ships wxWidgets 3.2 in apt and has an older glibc (2.36) than
    # the ubuntu-latest runner, so the artifact loads on more crew machines.
    # Ubuntu 22.04 has no wx 3.2 package at all — that was the old failure.
    container: debian:bookworm
    steps:
      - name: Install toolchain and wxWidgets 3.2
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates git lsb-release pkg-config \
            build-essential cmake gettext \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev libwxgtk-media3.2-dev \
            libgtk-3-dev libglu1-mesa-dev \
            libbz2-dev libcurl4-openssl-dev libexpat1-dev libcairo2-dev \
            libarchive-dev liblzma-dev liblz4-dev libexif-dev libelf-dev

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Metadata.cmake derives the package version from git describe,
          # so the full history and tags must be present.
          fetch-depth: 0

      - name: Mark the workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tarball
        run: cmake --build build --target tarball -j2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarball
          path: build/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (MSVC 2022, Win32, wxWidgets 3.2)
    runs-on: windows-2022
    env:
      # cache vcpkg's built packages between runs (wxWidgets from source is slow)
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: MSVC dev environment (x86 / Win32)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: wxWidgets 3.2 via vcpkg (x86-windows)
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A Win32 -T v143
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x86-windows
          -DwxWidgets_ROOT_DIR="$env:VCPKG_INSTALLED_DIR/x86-windows"
          -DwxWidgets_LIB_DIR="$env:VCPKG_INSTALLED_DIR/x86-windows/lib"

      - name: Build tarball
        run: cmake --build build --target tarball --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-win32-tarball
          path: build/*.tar.gz
          if-no-files-found: error
