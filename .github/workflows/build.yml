---
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 22.04, wxWidgets 3.2)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Metadata.cmake derives the package version from git describe,
          # so the full history and tags must be present.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake gettext \
            libwxgtk3.2-dev libwxgtk-webview3.2-dev libwxgtk-media3.2-dev \
            libgtk-3-dev libglu1-mesa-dev \
            libbz2-dev libcurl4-openssl-dev libexpat1-dev libcairo2-dev \
            libarchive-dev liblzma-dev liblz4-dev libexif-dev libelf-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build tarball
        run: cmake --build build --target tarball -j2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tarball
          path: build/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (MSVC 2022, Win32, wxWidgets 3.2)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # win_deps.bat downloads ~200MB of prebuilt wxWidgets into cache/.
      # Caching it turns a ~6 minute step into seconds.
      - name: Cache wxWidgets
        uses: actions/cache@v4
        with:
          path: cache
          key: wx-3.2.6-vc14x-win32

      - name: Build tarball
        shell: cmd
        run: ci\github-build-win.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-win32-tarball
          path: build/*.tar.gz
          if-no-files-found: error
