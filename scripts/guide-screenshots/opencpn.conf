; Seed config for make-screenshots.sh -- OpenCPN fills in everything else.
;
; ConfigVersionString + NavMessageShown skip the start-up navigation warning
; (it reappears whenever the string differs from the running OpenCPN; the
; script dismisses it if so). Any existing config skips the first-run
; wizard. Only the Intercept plugin is enabled, so the toolbar layout is
; fixed: the Intercept button is the one after Help.
[Settings]
ConfigVersionString=Version 5.10.2 Build 2024-09-11
NavMessageShown=1
Locale=en_US
ShowStatusBar=1
ShowMenuBar=1
ShowCompassWindow=1
SDMMFormat=0
ToolbarX=4
ToolbarY=4
[Settings/GlobalState]
nColorScheme=1
OwnShipLatLon=@OWN_LAT@,@OWN_LON@
FrameWinX=1100
FrameWinY=1000
FrameWinPosX=0
FrameWinPosY=0
FrameMax=0
ClientPosX=0
ClientPosY=0
ClientSzX=1700
ClientSzY=1000
[Settings/NMEADataSource]
; Network (1), UDP (1), any address, port 10110, NMEA 0183 input, enabled.
DataConnections=1;1;0.0.0.0;10110;0;;4800;1;0;1;;1;;0;0;0;0;1;guide-gps;0;;0;0;
[Settings/Others]
WaypointRangeRingsStepUnits=0
[Canvas]
CanvasConfig=0
[Canvas/CanvasConfig1]
canvasVPLatLon=@VIEW_LAT@,@VIEW_LON@
canvasVPScale=@VIEW_SCALE@
canvasVPRotation=0
[PlugIns/libintercept_pi.so]
bEnabled=1
[PlugIns/libdashboard_pi.so]
bEnabled=0
[PlugIns/libgrib_pi.so]
bEnabled=0
[PlugIns/libwmm_pi.so]
bEnabled=0
[PlugIns/libchartdldr_pi.so]
bEnabled=0
